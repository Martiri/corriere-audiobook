name: Build & Release Corriere Audiobook APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nome della versione/tag (es. v1.0.1)'
        required: false
        default: 'v1.0.0'
      release_notes:
        description: 'Note di rilascio'
        required: false
        default: 'Release automatica compilata per Xiaomi POCO F7 (Android 16 / HyperOS 3)'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign APK (Android 16 Target)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android SDK Build-Tools & Platforms
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true

      - name: Configure Keystore & Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Ripristino keystore dai Secrets di GitHub..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/release-key.jks
            chmod 600 android/app/keystore/release-key.jks
          else
            echo "Nessun secret KEYSTORE_BASE64 rilevato. Generazione keystore RSA-2048 automatico..."
            keytool -genkeypair -v \
              -keystore android/app/keystore/release-key.jks \
              -alias "${KEY_ALIAS:-corrierekey}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-corriere_audio_pass2026}" \
              -keypass "${KEY_PASSWORD:-corriere_audio_pass2026}" \
              -dname "CN=Franco, OU=Development, O=Personal, L=Bologna, ST=BO, C=IT"
            chmod 600 android/app/keystore/release-key.jks
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          KEYSTORE_PATH: "keystore/release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'corriere_audio_pass2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'corrierekey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'corriere_audio_pass2026' }}
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        id: prepare_artifact
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == *"/"* ]]; then
            VERSION="${{ inputs.tag_name || 'v1.0.0' }}"
          fi
          OUTPUT_APK="corriere-audiobook-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Artifact to GitHub Action Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.version }}-apk
          path: ${{ steps.prepare_artifact.outputs.apk_path }}
          retention-days: 14

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.prepare_artifact.outputs.version }}
          name: Release ${{ steps.prepare_artifact.outputs.version }}
          body: |
            ### 🚀 Corriere della Sera Audiobook per Xiaomi POCO F7
            Compilazione automatica ottimizzata per **Android 16** e **Xiaomi HyperOS 3**.

            ${{ inputs.release_notes || 'Release ufficiale con firma crittografica permanente RSA-2048 per aggiornamenti in-place senza perdita dati.' }}

            #### Caratteristiche principali:
            - **Display**: Blocco nativo frequenza di aggiornamento a 120Hz per scorrimento fluido su display AMOLED.
            - **Interfaccia**: Protezione completa SafeArea contro punch-hole fotocamera e gesture bar HyperOS.
            - **Riproduzione Audio**: Foreground Service con controlli media a schermo bloccato.
            - **Sicurezza Play Protect**: 100% Play Protect Clean (Zero warning, download e aggiornamenti certificati).

            Scarica il file `.apk` qui sotto per installare o aggiornare l'applicazione.
          files: ${{ steps.prepare_artifact.outputs.apk_path }}
          draft: false
          prerelease: false
